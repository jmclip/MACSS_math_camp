# Fermat's interior extremum theorem

* Suppose `\(f:[a, b] \rightarrow \mathbb{R}\)` and is differentiable on c. 
* Suppose `\(f\)` has a relative maximum or minimum on `\((a,b)\)` and call that `\(c \in (a, b)\)`
* Then `\(f'(c) = 0\)`

--

* Fermat's theorem guarantees that, at some point, `\(f^{'}(c) = 0\)`
* Intuition from proof - what happens as we approach from the left? 
* Intuition from proof - what happens as we approach from the right?

# Higher order derivatives
Conceptually, we are thinking about changes (get excited for all the *moments* you're going to have in stats later!). The first derivative tells us about the rate of change of our function.


--
**BUT!** we can also explore how fast the derivative is changing...that is, the rate of change for our rate of change. Here, we can understand the acceleration of change. We can keep going (provided our function is differentiable).

---

# Higher order derivatives
(in other words:)
* Derivatives of derivatives
* First derivative

    `$$f'(x),  ~~ y',  ~~ \frac{d}{dx}f(x), ~~ \frac{dy}{dx}$$`

* Second derivative

    `$$f''(x), ~~ y'', ~~ \frac{d^2}{dx^2}f(x), ~~ \frac{d^2y}{dx^2}$$`

* `\(n\)`th derivative

    `$$\frac{d^n}{dx^n}f(x), \quad \frac{d^ny}{dx^n}$$`

---

# Higher order derivatives
Example: Suppose we start with a function: `\(x^3\)` -- let's explore the different derivatives we might take. Try it out!    

--
$$
`\begin{aligned}
f(x) &amp;=x^3\\
f^{\prime}(x) &amp;=3x^2\\
f^{\prime\prime}(x) &amp;=6x \\
f^{\prime\prime\prime}(x) &amp;=6\\
f^{\prime\prime\prime\prime}(x) &amp;=0\\
\end{aligned}`
$$

* If `\(f(x)\)` is differentiable, then it is also continuous
* If `\(f'(x)\)` is differentiable, then f is also  **continuously differentiable**
* Note: these run one direction only. 
  * Continuous does not imply differentiable: `\(|x|\)` at `\(x=0\)` 
  * Continuously differentiable does not imply `\(f'\)` is differentiable: `\(x|x|\)` at  `\(x=0\)`
* Analytical optimization requires differentiation

# Concavity

* Concave up (convex)
* Concave down (concave)
* Verification
    * Graphically

---

# Concavity

* Where a function is twice differentiable over some area, then the function is concave down where `\(f''(x) &lt; 0\)` and concave up where `\(f''(x) &gt; 0\)`  


What does this mean? 
--  

* A critical point when f'(x)=0 has potential for some kind of concavity (sometimes, but not always! (`\(x^3\)`)).

* We are then moving away from that point and we're either *increasing* (min - concave up) or *decreasing* (max - concave down). 
  * If we're increasing through the critical point, the second derivative is positive, `\(f''(x) &gt; 0\)`. 
  * If we're decreasing through the critical point, the second derivative is negative, `\(f''(x) &lt; 0\)`.

---

# Concavity

* Where a function is twice differentiable and concave over some area, then the function is **concave down where `\(f''(x) &lt; 0\)`** and where `\(f''(x) &gt; 0\)` is **concave up**. Recall: `\(f(x)=(x^3 - 15 * x^2 + 60 * x + 30) / 15\)`.

# Framework for analytical optimization

1. Find `\(f'(x)\)`
1. Set `\(f'(x)=0\)` and solve for `\(x\)`. Call all `\(x_0\)` such that `\(f'(x_0)=0\)` or `\(f'(x_0)\)` does not exist **critical points**
1. Find `\(f''(x_0)\)`. Evaluate at each `\(x_0\)`
    * If `\(f''(x_0) &gt; 0\)`, concave up, and therefore a local minimum
    * If `\(f''(x_0) &lt; 0\)`, concave down, and therefore a local maximum
    * If it's the global maximum/minimum, it will produce the largest/smallest value for `\(f(x)\)`
    * On a closed range along the domain, **check the endpoints as well**

# Maximum likelihood estimation

* Likelihood function
* Distinguish from probability
* Known data, unknown parameters
* Maximize to find the values located at the **global maximum** of the likelihood function

---

# Maximum likelihood estimation

$$
`\begin{aligned}
f(\mu) &amp; = \prod_{i=1}^{N} \exp( \frac{-(Y_{i} - \mu)^2}{ 2}) \\
&amp; = \exp(- \frac{(Y_{1} - \mu)^2}{ 2}) \times \ldots \times \exp(- \frac{(Y_{N} - \mu)^2}{ 2}) \\
&amp; = \exp( - \frac{\sum_{i=1}^{N} (Y_{i} - \mu)^2} {2})
\end{aligned}`
$$

* Maximizing a function with very very very small numbers

---

# Maximum likelihood estimation

* Log-likelihood
    * `\(f:\mathbb{R} \rightarrow (0, \infty)\)`
    * If `\(x_{0}\)` maximizes `\(f\)`, then `\(x_{0}\)` maximizes `\(\log(f(x))\)`
* Maximize the log-likelihood instead (easier math!)

---

# Maximum likelihood estimation

$$
`\begin{aligned}
\log f(\mu) &amp; = \log \left( \exp( - \frac{\sum_{i=1}^{N} (Y_{i} - \mu)^2} {2}) \right)  \\
&amp; = - \frac{\sum_{i=1}^{N} (Y_{i} - \mu)^2} {2} \\
	&amp; = -\frac{1}{2} \left(\sum_{i=1}^{N} Y_{i}^2 - 2\mu \sum_{i=1}^{N} Y_{i} + N\times\mu^2 \right) \\
\frac{ \partial \log f(\mu) }{ \partial \mu } &amp; = 		-\frac{1}{2} \left( - 2\sum_{i=1}^{N} Y_{i} + 2 N \mu \right) 
\end{aligned}`
$$

---

# Maximum likelihood estimation

$$
`\begin{aligned}
0 &amp; = -\frac{1}{2} \left( - 2 \sum_{i=1}^{N} Y_{i} + 2 N \mu^{*} \right) \\
0 &amp; = \sum_{i=1}^{N} Y_{i} - N \mu^{*}  \\
N \mu^{*}  &amp; =  \sum_{i=1}^{N}Y_{i} \\
\mu^{*} &amp; = \frac{\sum_{i=1}^{N}Y_{i}}{N} \\
\mu^{*} &amp; = \bar{Y}
\end{aligned}`
$$

---

# Maximum likelihood estimation

* Second derivative test

$$
`\begin{aligned}
\frac{ \partial \log f(\mu) }{ \partial \mu } &amp; = -\frac{1}{2} \left( - 2\sum_{i=1}^{N} Y_{i} + 2 N \mu \right) \\
\frac{ \partial \log f(\mu) }{ \partial \mu }&amp; = \sum_{i=1}^{N} Y_{i} - N \mu \\
\frac{ \partial^2 \log f(\mu) }{ \partial \mu^2 }&amp; = -N 
\end{aligned}`
$$

--

* `\(-N&lt;0 \leadsto \text{concave down}\)`

## Example matrices
We have two matrices: X and Y. 

`$$\begin{aligned}\mathbf{X} &amp;= 
\left[ 
\begin{array}{rrr}1 &amp; 2 &amp; 3 \\
2 &amp; 1 &amp; 4 \\
\end{array} \right] \\
\mathbf{Y} &amp;= \left[ \begin{array}{rr}
1 &amp; 2 \\
3 &amp; 2 \\
1 &amp; 4 \\
\end{array} \right]
\end{aligned}$$`

X has two rows and three columns, so is `\(2 \times 3\)`. Y has three rows and two columns, so is `\(3 \times 2\)`. 

--

Matrices are incredibly helpful, despite also being a bit challenging to get the hang of. We'll talk more about them tomorrow but you will want to note the dimensions of a matrix. You can do some operations with them (addition / subtraction) and they work the way you are probably guessing (need to be the same size). **MULTIPLICATION DOES NOT WORK THAT WAY! WARNING!!!**

# Vectors
(*source: Gill*)
* Serial listing of numbers where the order matters
* Can add and subtract at will if conformable (either by adding / subtracting a constant (*scalar*) or adding / subtracting a second vector )
* If adding / subtracting vectors, they need to be *conformable* -- otherwise, *nonconformable*
* Multiplying vectors (not fun): Either dot `\(\cdot\)` or cross product `\(\times\)` (note: difference in these!)
  * dot product AKA inner product, produces a scalar. (we'll get to this later)
  * cross product, produces vector
---

# Vector/scalar addition/multiplication

$$
`\begin{aligned}
\mathbf{u} &amp; =  [1, 2, 3, 4, 5]  \\
\mathbf{v} &amp; =  [1, 1, 1, 1, 1]  \\
k &amp; =  2
\end{aligned}`
$$

--

$$
`\begin{aligned}
\mathbf{u}  + \mathbf{v} &amp; = [1 + 1, 2 + 1, 3+ 1, 4 + 1, 5+ 1]  = [2, 3, 4, 5, 6] \\
k \mathbf{u} &amp; = [2 \times 1, 2 \times 2, 2 \times 3, 2 \times 4, 2 \times 5] = [2, 4, 6, 8, 10]  \\
k \mathbf{v} &amp; = [2 \times 1,2 \times 1,2 \times 1,2 \times 1,2 \times 1] = [2, 2, 2, 2, 2]
\end{aligned}`
$$

# Linear combinations: (in)dependence

* **Linear independence**: cannot get from one vector to another through linear combination 
  * Another way to consider is if you have to go *beyond the space (span)* of the set to include an additional vector. 
  * Can think of as multiplication by a scalar, but technically, combining each NON-ZERO vector, multiplied by a scalar, gives us zero. ( `\(\mathbf{v}_1, \mathbf{v}_2, \ldots \mathbf{v}_k\)` are linearly dependent if and only if there exist scalars `\(\alpha_1, \alpha_2, \ldots, \alpha_k\)` *not all zero* such that `\(\alpha_1 \mathbf{v}_1 + \alpha_2 \mathbf{v}_2 + \ldots + \alpha_k \mathbf{v}_k = \mathbf{0}\)`)
* Overall, we may be in a situation where the number of dimensions helps us understand the size of the solution set

--

* **Question** Do you make a zero vector with *some* combo of all of these?

---

# Linear (in)dependence

`$$\mathbf{a} = \begin{bmatrix}
3 \\
1
\end{bmatrix}, \quad \mathbf{b} = \begin{bmatrix}
2 \\
2
\end{bmatrix}, \quad \mathbf{c} = \begin{bmatrix}
1 \\
3
\end{bmatrix}$$`

Is the set linearly dependent? 
--

These are (together) linearly dependent.

--

`$$\mathbf{a}-2\times\mathbf{b}+\mathbf{c} =\Big( \begin{matrix} 0 \\ 0 \end{matrix}\Big)$$`

---

# Detecting linear dependence

* `\(\mathbf{v}_1, \mathbf{v}_2, \ldots \mathbf{v}_k\)` are linearly dependent if and only if there exist scalars `\(\alpha_1, \alpha_2, \ldots, \alpha_k\)` *not all zero* such that

    `$$\alpha_1 \mathbf{v}_1 + \alpha_2 \mathbf{v}_2 + \ldots + \alpha_k \mathbf{v}_k = \mathbf{0}$$`

---

# Example: determining (in)dependence

`$$\mathbf{a} = \begin{bmatrix}
2 \\
1 \\
2
\end{bmatrix}, \quad \mathbf{b} = \begin{bmatrix}
4 \\
1 \\
3
\end{bmatrix}, \quad \mathbf{c} = \begin{bmatrix}
1 \\
1 \\
2
\end{bmatrix}$$`

If we're not sure what to do, we set this up as trying to solve for our variable of choice. So, if we're multiplying scalars, it must be the case, for example, that `\(2\alpha + 4\beta + 1\gamma = 0\)`, and so on. That is, we're trying to solve for `\(\alpha \mathbf{a} + \beta\mathbf{b} + \gamma\mathbf{c} = \mathbf{0}\)`.
--

* Express as a **system of equations** (note: renaming each line so you can see the transformations more easily on the next slide)

    `$$\begin{aligned}2\alpha &amp;+ 4\beta &amp;+ \gamma  &amp;= 0 \text{ (}\mathbf{h}\text{) }\\
    \alpha &amp;+ \beta &amp;+ \gamma  &amp;= 0 \text{ (}\mathbf{j}\text{) }\\
    2\alpha &amp;+ 3\beta &amp;+ 2\gamma &amp;= 0\text{ (}\mathbf{k}\text{) }
    \end{aligned}$$`

---
## Aside: solving systems of equations

* Need at least x equations for x unknowns (e.g. 2 unknowns, 2 equations)
* Multiply/divide each equation and add together 
* Different approaches, but often try to eliminate or 'kick out' variables to get down to solving for one variable 
* Once you have one variable, continue!

---
# Solve the system of equations
Let's work through an example to evaluate whether our matrices (technically vectors) are linearly independent or dependent. 

* **Step 1:** We re-write our matrices from the previous slide, setting each equal to zero. Note that we've named them to make following along a little easier. 

* **Step 2:** We leave our first equation `\(\mathbf{h}\)` as-is. We then take our second equation and calculate: `\(h-k\)` and replace that result in the third row. We can see from the third row that `\(\beta = \gamma\)`.


---
# Solve the system of equations - example
Let's work through an example to evaluate whether our matrices are linearly independent or dependent. 

* **Step 1: write out equations**

`$$\begin{aligned}
2\alpha + 4\beta &amp;+ \gamma  &amp;= 0 \text{ (}\mathbf{h}\text{) }\\
\alpha + \beta &amp;+ \gamma  &amp;= 0 \text{ (}\mathbf{j}\text{) }\\
2\alpha + 3\beta &amp;+ 2\gamma &amp;= 0\text{ (}\mathbf{k}\text{) }
\end{aligned}$$`

* **Step 2: Add/subtract**

$$
`\begin{aligned}
 2\alpha + 4\beta + \gamma &amp;= 0 \\
  \alpha + \beta + \gamma &amp;= 0 \\
 \beta - \gamma &amp;= 0
\end{aligned}`
$$


---

# Solve the system of equations
Let's work through an example to evaluate whether our matrices are linearly independent or dependent. 

.pull-left[

* **Step 2: Add/subtract**

$$
`\begin{aligned}
 2\alpha + 4\beta + \gamma &amp;= 0 \\
  \alpha + \beta + \gamma &amp;= 0 \\
 \beta - \gamma &amp;= 0
\end{aligned}`
$$

* **Step 3: ... Solve ...**

$$ 
`\begin{aligned}
 2\alpha + 5\gamma &amp;= 0 \\
  \alpha + 2\gamma &amp;= 0 \\
 -\beta + \gamma &amp;= 0
\end{aligned}`
$$
]

.pull-right[


* **Step 3**: Now, we continue to work, trying to solve for any of our three variables (three variables, three equations). We can sub in `\(\gamma\)` for `\(\beta\)` and simplify our middle equation.  


]

# Solve the system of equations
Let's work through an example to evaluate whether our matrices are linearly independent or dependent. 

.pull-left[

* **Step 3: ... Solve ...**

$$ 
`\begin{aligned}
 2\alpha + 5\gamma &amp;= 0 \\
  \alpha + 2\gamma &amp;= 0 \\
 -\beta + \gamma &amp;= 0
\end{aligned}`
$$

* **Step 4: ... continue ...**

$$ 
`\begin{aligned}
  \gamma &amp;= 0 \\
  \alpha + 2\gamma &amp;= 0 \\
 -\beta + \gamma &amp;= 0
\end{aligned}`
$$
]

.pull-right[


* **Step 4**:  We can then take 2 times our middle row (j) from the top row (replacing h) to get `\(\gamma = 0\)`. As `\(\gamma = \beta = 0\)`, we can substitute those into our middle equation. 



]

---

## So what? Conclusion


* **Conclusion**: This means that ... `\(\alpha = 0\)` as well. Therefore, these equations (and matrices) are linearly independent as the only possible solution that satisfies our requirements is for all variables to be zero (trivial). 


---

# Example
Now, let's try this together -- work with a partner. Are these matrices linearly dependent or independent? 

`$$\mathbf{a} = \begin{bmatrix}
4 \\
3 \\
3
\end{bmatrix}, \quad \mathbf{b} = \begin{bmatrix}
2 \\
1 \\
-1
\end{bmatrix}, \quad \mathbf{c} = \begin{bmatrix}
1 \\
1 \\
2
\end{bmatrix}$$`

---
# Example
* **Step 1: write out**
$$
`\begin{aligned}
4\alpha + 2\beta + 1\gamma &amp;= 0 (h)\\
3\alpha + 1\beta + 1\gamma &amp;= 0 (j)\\
3\alpha - 1\beta + 2\gamma &amp;= 0 (k)
\end{aligned}`
$$

--

* **Step 2: manipulate (j-k)**
$$
`\begin{aligned}
4\alpha + 2\beta + 1\gamma &amp;= 0 \\
 2\beta - 1\gamma &amp;= 0 \\
3\alpha - 1\beta + 2\gamma &amp;= 0
\end{aligned}`
$$

--

* **Step 3: Solve!!**
$$
`\begin{aligned}
4\alpha + 4\beta &amp;= 0 \\
 2\beta &amp;=\gamma  \\
\end{aligned}`
$$

--


`$$\gamma = 2, \quad \beta = 1, \quad \alpha = -1$$`
*Is this our only solution?*

--

(no! linearly dependent)

document.addEventListener("DOMContentLoaded", function () {

  // Export to PDF button inside the menu
  const exportBtn = document.createElement("button");
  exportBtn.textContent = "📄 Export to PDF";
  Object.assign(exportBtn.style, {
    width: "100%",
    padding: "6px",
    marginBottom: "8px",
    border: "none",
    background: "#0B6884",
    color: "#fff",
    borderRadius: "3px",
    cursor: "pointer"
  });
  exportBtn.addEventListener("click", () => {
    menu.style.display = "none";
    window.print();
  });
  menu.appendChild(exportBtn);

  // Get all slides
  const allSlides = slideshow.getSlides();

  // Build menu items (skip incremental slides)
  let displayNumber = 1;
  allSlides.forEach((slide, internalIndex) => {
    if (slide.properties.continued === "true") {
      return; // skip incremental steps
    }

    const slideElement = document.querySelector(
      `.remark-slide-container:nth-of-type(${internalIndex + 1})`
    );
    const heading = slideElement?.querySelector("h1, h2, h3");
    const title = heading
      ? heading.textContent.trim()
      : `Slide ${displayNumber}`;

    const link = document.createElement("a");
    link.textContent = `${displayNumber}. ${title}`;
    Object.assign(link.style, {
      display: "block",
      color: "#0B6884",
      textDecoration: "none",
      marginBottom: "6px",
      padding: "4px 6px",
      borderRadius: "3px",
      userSelect: "none"
    });

    link.addEventListener("mouseenter", () => {
      link.style.background = "#ddd";
    });
    link.addEventListener("mouseleave", () => {
      link.style.background = "transparent";
    });

    // Use the actual remark.js 1-based slide index
    link.addEventListener("click", (e) => {
      e.preventDefault();
      menu.style.display = "none";
      slideshow.gotoSlide(internalIndex + 1);
    });

    menu.appendChild(link);
    displayNumber++;
  });

  document.body.appendChild(menu);

  // Toggle menu
  toggleBtn.addEventListener("click", () => {
    menu.style.display = menu.style.display === "none" ? "block" : "none";
  });

  // Close on slide change
  slideshow.on("afterShowSlide", () => {
    menu.style.display = "none";
  });
});
